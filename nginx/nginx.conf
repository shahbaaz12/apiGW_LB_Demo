# Basic Nginx load balancer config

events {}

http {
  # Define upstream group (our Node app instances)
  upstream node_app {
    server app1:3000;   # first app container
    server app2:3001;   # second app container
  }

  # Default server block
  server {
    listen 80;

    # Route all traffic to our Node apps
    location / {
      proxy_pass http://node_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Optional: quick health endpoint for Nginx itself
    location /health {
      return 200 'Nginx OK';
      add_header Content-Type text/plain;
    }
  }
}
